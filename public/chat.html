<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8"><title>TikTok Chat</title>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;600&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;background:transparent;overflow:hidden;font-family:'Prompt','Noto Sans Thai',system-ui,sans-serif}
#l{position:absolute;left:0;right:0;bottom:0;padding:8px;display:flex;flex-direction:column;align-items:flex-start;gap:6px}
.m{display:flex;align-items:flex-start;gap:8px;background:rgba(0,0,0,.5);color:#fff;padding:6px 12px;border-radius:14px;font-size:var(--s);line-height:1.35;max-width:100%;animation:in .3s both;text-shadow:0 1px 3px #000;transition:opacity .6s}
.m img{width:1.6em;height:1.6em;border-radius:50%;flex:none}
.m b{margin-right:.4em;font-weight:600}.m span{word-break:break-word}
@keyframes in{from{opacity:0;transform:translateY(12px)}}
</style></head>
<body><div id="l"></div>
<script>
// ไม่ใส่ ?user= ก็ได้: จะมีช่องกรอกชื่อขึ้นมา (จำค่าไว้) / เอาเมาส์ไปชี้มุมซ้ายบนจะมีปุ่ม ⚙ ไว้เปลี่ยนชื่อ
// ?user=ชื่อ TikTok  &max=จำนวนข้อความ  &fade=หายหลังกี่วินาที  &s=ขนาดตัวอักษร px
const q=new URLSearchParams(location.search),max=+q.get('max')||8,fade=+q.get('fade')||0;
document.documentElement.style.setProperty('--s',(q.get('s')||26)+'px');
const L=document.getElementById('l');
const col=n=>{let h=0;for(const c of n)h=(h*31+c.charCodeAt(0))%360;return`hsl(${h} 85% 72%)`};
const onMsg=e=>{
 const d=JSON.parse(e.data);if(d.type!=='chat'||!d.text)return;
 const m=document.createElement('div');m.className='m';
 if(d.avatar){const i=document.createElement('img');i.src=d.avatar;i.onerror=()=>i.remove();m.appendChild(i)}
 const w=document.createElement('div'),b=document.createElement('b'),s=document.createElement('span');
 b.textContent=d.name;b.style.color=col(d.name);s.textContent=d.text;w.append(b,s);m.appendChild(w);L.appendChild(m);
 while(L.children.length>max)L.firstChild.remove();
 if(fade)setTimeout(()=>{m.style.opacity=0;setTimeout(()=>m.remove(),700)},fade*1000);
};

const reset=()=>{L.innerHTML=''};

let es,cur='';const K='tt_user',st=()=>{try{return localStorage.getItem(K)||''}catch{return''}};
const mk=(t,css,x)=>{const e=document.createElement(t);e.style.cssText=css;if(x)e.textContent=x;return e};
const gear=mk('button','position:fixed;top:6px;left:6px;width:30px;height:30px;border:0;border-radius:50%;background:#000a;color:#fff;font-size:16px;cursor:pointer;opacity:0;transition:opacity .2s;z-index:8','⚙');
gear.title='เปลี่ยนชื่อ TikTok';gear.onmouseenter=()=>gear.style.opacity=1;gear.onmouseleave=()=>gear.style.opacity=0;
const box=mk('div','position:fixed;top:8px;left:8px;background:#000c;color:#fff;padding:10px;border-radius:10px;font:14px system-ui,sans-serif;display:none;gap:6px;z-index:9');
const inp=mk('input','padding:6px;border-radius:6px;border:0');inp.placeholder='ชื่อ TikTok (ไม่ต้องมี @)';
const ok=mk('button','padding:6px 10px;border:0;border-radius:6px;background:#fe2c55;color:#fff;cursor:pointer','เชื่อมต่อ');
box.append(inp,ok);document.body.append(gear,box);
function show(){inp.value=cur;box.style.display='flex';gear.style.display='none';inp.focus()}
function go(u){u=u.replace(/^@/,'').trim();if(!u)return;cur=u;try{localStorage.setItem(K,u)}catch{}if(es)es.close();reset();box.style.display='none';gear.style.display='';es=new EventSource('/events?user='+encodeURIComponent(u));es.onmessage=onMsg}
gear.onclick=show;ok.onclick=()=>go(inp.value);inp.onkeydown=e=>{if(e.key==='Enter')go(inp.value)};
const u0=q.get('user')||st();if(u0)go(u0);else show();
</script></body></html>
